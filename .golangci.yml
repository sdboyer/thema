version: "2"

linters:
  default: none
  # Carried over from the v1 config. Dropped in the v2 migration:
  #  - exportloopref: obsolete since Go 1.22's per-iteration loop variables.
  #  - gosimple, stylecheck: merged into staticcheck.
  #  - typecheck: no longer a linter; type errors always fail the run.
  #  - goimports: now a formatter (see below).
  #  - gomnd: renamed to mnd.
  enable:
    - dogsled
    - errcheck
    - forbidigo
    - gochecknoinits
    - goconst
    - gocritic
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - mnd
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    forbidigo:
      # The CLI's contract: every failure is a coded diagnostic, which report
      # writes, and main exits with its status. Scoped to cmd/thema below.
      forbid:
        - pattern: ^os\.Exit$
          pkg: ^os$
          msg: only main exits; return the error, and report gives the status
        - pattern: ^os\.Stderr$
          pkg: ^os$
          msg: only report and warn write to stderr; return a diagnostic
        - pattern: ^cobra\.Command\.(ErrOrStderr|PrintErr|PrintErrln|PrintErrf)$
          pkg: ^github\.com/spf13/cobra$
          msg: only report and warn write to stderr; return a diagnostic
        - pattern: ^panic$
          msg: return a diagnostic; a panic is for what cannot be reached, and says why
      analyze-types: true
    govet:
      # v1's check-shadowing.
      enable:
        - shadow
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: false
      allow-unused: false
    revive:
      confidence: 0
  exclusions:
    generated: lax
    paths:
      # Vendored-in third-party code; not ours to lint.
      - internal/cuetsy
    rules:
      # forbidigo's rules are the CLI's contract, so they hold in cmd/thema
      # alone, and not in its tests, which re-execute main from TestMain
      # and may fail however a test fails.
      - path-except: ^cmd/thema/
        linters:
          - forbidigo
      - path: _test\.go$
        linters:
          - forbidigo

formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - internal/cuetsy
