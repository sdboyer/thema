version: "2"

linters:
  default: none
  # Carried over from the v1 config. Dropped in the v2 migration:
  #  - exportloopref: obsolete since Go 1.22's per-iteration loop variables.
  #  - gosimple, stylecheck: merged into staticcheck.
  #  - typecheck: no longer a linter; type errors always fail the run.
  #  - goimports: now a formatter (see below).
  #  - gomnd: renamed to mnd.
  enable:
    - dogsled
    - errcheck
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - mnd
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    gocyclo:
      min-complexity: 15
    govet:
      # v1's check-shadowing.
      enable:
        - shadow
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: false
      allow-unused: false
    revive:
      confidence: 0
  exclusions:
    generated: lax
    paths:
      # Vendored-in third-party code; not ours to lint.
      - internal/cuetsy

formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - internal/cuetsy
