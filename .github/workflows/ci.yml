name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: go.mod
            go-version-file: go.mod
          - go: stable
            go-version: stable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go-version-file }}
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Test
        run: go test ./...

      # A module of its own, so that the validators it compares are not
      # thema's dependencies: its tests keep the comparison honest.
      - name: Test the benchmarks' pipelines
        run: go test ./...
        working-directory: internal/bench

  # The playground compiled to WebAssembly: its tests under Go's js/wasm
  # runner (node), and the CLI built with the bundle embedded. The test job's
  # TestWasmSmoke runs the JS bridge the way a browser loads it.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: playground/.nvmrc
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - name: Install the frontend's dependencies
        run: npm ci
        working-directory: playground

      - name: Test the playground under wasm
        run: PATH="$PATH:$(go env GOROOT)/lib/wasm" GOOS=js GOARCH=wasm go test ./playground/...

      # The bundle: this thema's wasm, and the frontend built against it.
      - name: Build the playground bundle
        run: go generate ./cmd/thema/playground

      # go generate leaves this tree's thema.wasm beside the frontend, so its
      # tests run against the thema they ship with.
      - name: Test the frontend against this thema
        run: npm test
        working-directory: playground

      # The editor components ship as a package; its build must keep working.
      - name: Build the components package
        run: npm run build --workspace components
        working-directory: playground

      - name: Build the CLI with the playground
        run: go build -tags playgroundui -o /dev/null ./cmd/thema

  # The release workflow, rehearsed on this commit with nothing published:
  # goreleaser's release as a snapshot, the npm packages staged from the
  # bundle it built and published with --dry-run, and the CUE module the
  # same. make release tags only a commit this passed on.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: playground/.nvmrc
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      # A prerelease of the version a release of this commit would be.
      - name: Choose the rehearsal's version
        run: echo "VERSION=$(sed -n 's/^const ThemaModuleVersion = "v\(.*\)"$/\1/p' internal/util/modfile.go)-rehearsal" >> "$GITHUB_ENV"

      - name: Rehearse publishing the npm packages
        run: |
          npm run build --workspace components
          node scripts/release.mjs stage "$VERSION" ../cmd/thema/playground/dist "$RUNNER_TEMP/npm"
          node scripts/release.mjs publish "$RUNNER_TEMP/npm" --dry-run
        working-directory: playground

      - name: Install cue
        run: go install "cuelang.org/go/cmd/cue@$(go list -m -f '{{.Version}}' cuelang.org/go)"

      - name: Rehearse publishing the CUE module
        run: cue mod publish --dry-run "v$VERSION"

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          # The existing code carries a few hundred findings spread across
          # every linter, predating this config. Only fail on issues
          # introduced by the PR (or pushed commits) until those are paid
          # down; drop this to make lint fully enforcing.
          only-new-issues: true

  cue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Use the same CUE version the Go module evaluates thema's CUE with.
      - name: Install cue
        run: go install "cuelang.org/go/cmd/cue@$(go list -m -f '{{.Version}}' cuelang.org/go)"

      - name: cue mod tidy --check
        run: cue mod tidy --check

      - name: cue fmt --check
        run: cue fmt --check . ./exemplars

      # Thema's packages are schemas and lineage definitions, so they are
      # legitimately non-concrete; vet for errors, not completeness.
      - name: cue vet
        run: cue vet -c=false . ./exemplars
